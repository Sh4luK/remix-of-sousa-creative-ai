upstream django_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 15M;  # uploads de imagem (produto/logo) + data URLs

    # API REST + Admin → gunicorn
    location /api/ {
        proxy_pass http://django_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://django_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Estáticos do Django (admin) servidos pelo whitenoise via gunicorn
    location /static/ {
        proxy_pass http://django_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MEDIA público (imagens de produto e logo da marca) — volume compartilhado.
    # Gerações são privadas e servidas por /api/generations/<id>/image/ (não aqui).
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
    }

    # SPA React
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
