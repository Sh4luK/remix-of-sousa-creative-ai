# Simulação/deploy de produção: gunicorn + nginx reverse proxy.
# Subir: docker compose -f docker-compose.prod.yml up --build
# App em http://localhost (nginx serve o React e faz proxy de /api e /admin).
name: pj-midia-prod
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pj-midia-api:prod
    container_name: pj-midia-api-prod
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      # Em deploy real com TLS na frente, ALLOWED_HOSTS/CORS/CSRF devem apontar
      # pro domínio público e SECURE_SSL_REDIRECT=True.
      - SECURE_SSL_REDIRECT=False
      - REDIS_URL=redis://redis:6379/0
      # 1 proxy à frente (nginx). Se houver CDN/LB adicional na frente, aumente.
      - NUM_PROXIES=1
    volumes:
      - media:/app/media
    expose:
      - "8000"
    depends_on:
      - redis
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    restart: unless-stopped

  web:
    build:
      context: .
      target: production
      args:
        # Vazio = mesma origem (nginx faz proxy de /api). Sem CORS.
        VITE_API_URL: ""
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
    image: pj-midia-web:prod
    container_name: pj-midia-web-prod
    ports:
      - "80:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/var/www/media:ro
    depends_on:
      - api
    restart: unless-stopped

  # Redis: cache compartilhado para rate limit global entre os workers gunicorn
  redis:
    image: redis:7-alpine
    container_name: pj-midia-redis-prod
    command: redis-server --save "" --appendonly no
    restart: unless-stopped

volumes:
  media:
